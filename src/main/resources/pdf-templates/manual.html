<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <style>
        /* ===== TEMPLATE MANUEL : document technique, structuré ===== */
        /* openhtmltopdf : pas de counter(), pas de ::before content,
           pas de padding sur body — on utilise un wrapper .page */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "DejaVu Sans", Arial, sans-serif;
            font-size: 11px;
            background: white;
            color: #1a1a1a;
        }

        /* Wrapper principal qui remplace le padding body */
        .page {
            padding: 36px 48px;
        }

        /* ---- Page de garde façon document officiel ---- */
        .cover {
            border: 2px solid #1a1a1a;
            padding: 24px;
            margin-bottom: 28px;
            text-align: center;
        }
        .cover .doc-type {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 12px;
        }
        .cover h1 {
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            border-top: 1px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
            padding: 8px 0;
        }
        .cover .desc {
            font-size: 11px;
            color: #555;
            font-style: italic;
            line-height: 1.6;
            margin-top: 10px;
        }
        .cover .ref {
            font-size: 9px;
            color: #888;
            margin-top: 14px;
            font-family: "DejaVu Sans Mono", monospace;
        }

        /* ---- Bloc contact dans la page de garde ---- */
        .contact-info {
            font-size: 10px;
            color: #444;
            margin-top: 10px;
            line-height: 1.8;
            border-top: 1px solid #bbb;
            padding-top: 8px;
        }

        /* ---- Chaque rubrique ---- */
        .rubric {
            margin-bottom: 22px;
        }

        /* ---- Titre rubrique : double bordure pour l'effet document ---- */
        .rubric h3 {
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #1a1a1a;
            padding: 4px 8px;
            margin-bottom: 10px;
            border-top: 2px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
            background: #f5f5f5;
        }

        /* ---- Chaque élément ---- */
        .item {
            margin-bottom: 10px;
            padding: 6px 10px;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
        }
        .item strong {
            font-size: 12px;
            display: block;
            margin-bottom: 2px;
        }
        .dates {
            font-size: 10px;
            color: #666;
            font-style: italic;
        }
        .item p {
            font-size: 10px;
            color: #444;
            margin-top: 3px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<div class="page">

    <!-- Page de garde façon document technique officiel -->
    <div class="cover">
        <div class="doc-type">Curriculum Vitae -- Document officiel</div>
        <h1>{{ownerName}}</h1>
        <div class="desc">{{description}}</div>
        <!-- Bloc informations personnelles -->
        <div class="contact-info">
            Email : {{email}} &#160;&#160; Tel : {{phone}} &#160;&#160; Adresse : {{address}}
        </div>
        <div class="ref">REF : CV-{{ownerName}}</div>
    </div>

    <!-- Corps : rubriques generees par PdfService -->
    <div class="body">
        {{rubrics}}
    </div>

</div>
</body>
</html>
