<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <style>
        /* ===== TEMPLATE INFORMATIQUE : style terminal sombre, profil IT ===== */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "DejaVu Sans Mono", "Courier New", monospace;
            font-size: 11px;
            background: #1e1e1e;
            color: #d4d4d4;
        }

        /* ---- En-tête façon terminal ---- */
        .header {
            background: #252526;
            border-bottom: 2px solid #007acc;
            padding: 20px 28px;
        }

        /* ---- Barre de titre façon IDE (onglet) ---- */
        .tab-bar {
            background: #2d2d2d;
            padding: 6px 28px;
            font-size: 10px;
            color: #888;
            border-bottom: 3px solid #007acc;
        }
        /* span avec background/padding remplacé par un simple texte coloré */
        .tab-bar .tab-label {
            color: #d4d4d4;
            font-weight: bold;
        }

        /* ---- Prompt terminal avant le nom ---- */
        .prompt {
            color: #569cd6;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: bold;
            color: #4ec9b0;
            margin-bottom: 6px;
        }
        .header .desc {
            font-size: 10px;
            color: #9cdcfe;
            line-height: 1.6;
        }

        /* ---- Corps principal ---- */
        .body {
            padding: 16px 28px;
        }

        /* ---- Chaque rubrique ---- */
        .rubric {
            margin-bottom: 18px;
        }

        /* ---- Titre rubrique façon commentaire de code ---- */
        /* ::before non supporté par openhtmltopdf — préfixe retiré, remplacé par style coloré */
        .rubric h3 {
            font-size: 11px;
            color: #6a9955;
            margin-bottom: 8px;
            font-weight: bold;
            padding-left: 14px;
            border-left: 3px solid #6a9955;
        }

        /* ---- Chaque élément ---- */
        .item {
            background: #252526;
            border: 1px solid #3c3c3c;
            border-left: 3px solid #007acc;
            padding: 7px 10px;
            margin-bottom: 6px;
        }
        .item strong {
            color: #dcdcaa;
            font-size: 11px;
            display: block;
            margin-bottom: 2px;
        }
        /* ::before non supporté — couleur suffit à identifier les dates */
        .dates {
            font-size: 10px;
            color: #569cd6;
        }
        .item p {
            font-size: 10px;
            color: #9cdcfe;
            margin-top: 3px;
            line-height: 1.5;
        }

        /* ---- Bloc contact façon JSON ---- */
        .contact-block {
            background: #1e1e1e;
            padding: 8px 28px 10px 28px;
            font-size: 10px;
            color: #ce9178;
            border-bottom: 1px solid #3c3c3c;
        }
        .contact-block .ck { color: #9cdcfe; }
        .contact-block .cv { color: #ce9178; }
    </style>
</head>
<body>

    <!-- Barre d'onglet façon IDE -->
    <div class="tab-bar">
        <span class="tab-label">cv.json</span>
    </div>

    <!-- En-tête façon terminal -->
    <div class="header">
        <div class="prompt">&gt; user.profile</div>
        <h1>{{ownerName}}</h1>
        <div class="desc">// {{description}}</div>
    </div>

    <!-- Infos de contact façon JSON -->
    <div class="contact-block">
        <span class="ck">"email"</span>: <span class="cv">"{{email}}"</span> &#160;|&#160;
        <span class="ck">"phone"</span>: <span class="cv">"{{phone}}"</span> &#160;|&#160;
        <span class="ck">"address"</span>: <span class="cv">"{{address}}"</span>
    </div>

    <!-- Corps : rubriques générées par PdfService -->
    <div class="body">
        {{rubrics}}
    </div>

</body>
</html>
