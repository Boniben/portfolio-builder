<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <style>
        /* ===== TEMPLATE CLASSIQUE : sobre, professionnel, noir et blanc ===== */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "DejaVu Sans", Arial, sans-serif;
            font-size: 11px;
            color: #1a1a1a;
            background: white;
        }

        /* ---- En-tête : bande sombre avec le nom en grand ---- */
        .header {
            background-color: #1a1a1a;
            color: white;
            padding: 28px 36px 22px 36px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .header .desc {
            font-size: 11px;
            color: #cccccc;
            line-height: 1.5;
        }

        /* ---- Corps principal ---- */
        .body {
            padding: 24px 36px;
        }

        /* ---- Chaque rubrique (Formation, Expérience...) ---- */
        .rubric {
            margin-bottom: 20px;
        }
        .rubric h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #1a1a1a;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 4px;
            margin-bottom: 10px;
        }

        /* ---- Chaque élément dans une rubrique ---- */
        .item {
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 3px solid #ddd;
        }
        .item strong {
            font-size: 12px;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }
        .dates {
            font-size: 10px;
            color: #666;
            font-style: italic;
        }
        .item p {
            font-size: 10px;
            color: #444;
            margin-top: 3px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- En-tête sombre avec le nom et la description -->
    <div class="header">
        <h1>{{ownerName}}</h1>
        <div class="desc">{{description}}</div>
    </div>

    <!-- Corps : rubriques générées par PdfService -->
    <div class="body">
        {{rubrics}}
    </div>

</body>
</html>
