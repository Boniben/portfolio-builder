<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <style>
        /* ===== TEMPLATE MINIMALISTE : épuré, typographie soignée ===== */
        /* openhtmltopdf : pas de ::before/after content, pas de :last-child,
           pas de margin:auto sur hr, pas de padding sur body */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "DejaVu Sans", Arial, sans-serif;
            font-size: 11px;
            color: #2c2c2c;
            background: white;
        }

        /* Wrapper principal qui remplace le padding body */
        .page {
            padding: 44px 52px;
        }

        /* ---- En-tête centré ---- */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .header .desc {
            font-size: 11px;
            color: #777;
            font-style: italic;
            line-height: 1.6;
        }

        /* ---- Séparateur : div a la place de hr (plus fiable en PDF) ---- */
        .divider {
            height: 1px;
            background: #bbb;
            width: 50%;
            margin: 0 auto 28px auto;
        }

        /* ---- Chaque rubrique ---- */
        .rubric {
            margin-bottom: 22px;
        }

        /* ---- Titre rubrique : petit, tout en majuscule, espacé ---- */
        .rubric h3 {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #999;
            font-weight: normal;
            margin-bottom: 10px;
        }

        /* ---- Chaque élément ---- */
        .item {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e0e0e0;
        }
        .item strong {
            font-size: 12px;
            font-weight: bold;
            color: #1a1a1a;
            display: block;
            margin-bottom: 2px;
        }
        .dates {
            font-size: 10px;
            color: #aaa;
        }
        .item p {
            font-size: 10px;
            color: #666;
            margin-top: 3px;
            line-height: 1.6;
            font-style: italic;
        }

        /* ---- Contact centré sous la description ---- */
        .contact-line {
            text-align: center;
            font-size: 10px;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="page">

    <!-- En-tête centré : nom + description -->
    <div class="header">
        <h1>{{ownerName}}</h1>
        <div class="desc">{{description}}</div>
        <!-- Informations de contact sur une ligne -->
        <div class="contact-line">{{email}} | {{phone}} | {{address}}</div>
    </div>

    <!-- Séparateur : div au lieu de <hr> pour éviter les bugs openhtmltopdf -->
    <div class="divider"></div>

    <!-- Rubriques générées par PdfService -->
    {{rubrics}}

</div>
</body>
</html>
