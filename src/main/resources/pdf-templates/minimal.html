<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <style>
        /* ===== TEMPLATE MINIMALISTE : épuré, typographie soignée ===== */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "DejaVu Serif", Georgia, serif;
            font-size: 11px;
            color: #2c2c2c;
            background: white;
            padding: 44px 52px;
        }

        /* ---- En-tête centré ---- */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .header .desc {
            font-size: 11px;
            color: #777;
            font-style: italic;
            line-height: 1.6;
        }

        /* ---- Ligne de séparation centrale ---- */
        .divider {
            border: none;
            border-top: 1px solid #bbb;
            width: 50%;
            margin: 0 auto 28px auto;
        }

        /* ---- Chaque rubrique ---- */
        .rubric {
            margin-bottom: 22px;
        }

        /* ---- Titre rubrique : petit, tout en majuscule, espacé ---- */
        .rubric h3 {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #999;
            font-weight: normal;
            margin-bottom: 10px;
        }

        /* ---- Chaque élément ---- */
        .item {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dotted #e0e0e0;
        }
        .item:last-child {
            border-bottom: none;
        }
        .item strong {
            font-size: 12px;
            font-weight: bold;
            color: #1a1a1a;
            display: block;
            margin-bottom: 2px;
        }
        .dates {
            font-size: 10px;
            color: #aaa;
        }
        .item p {
            font-size: 10px;
            color: #666;
            margin-top: 3px;
            line-height: 1.6;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- En-tête centré : nom + description -->
    <div class="header">
        <h1>{{ownerName}}</h1>
        <div class="desc">{{description}}</div>
    </div>

    <!-- Séparateur décoratif -->
    <hr class="divider"/>

    <!-- Rubriques générées par PdfService -->
    {{rubrics}}

</body>
</html>
