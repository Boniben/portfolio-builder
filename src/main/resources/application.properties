spring.application.name=portfolio1

# ============================================================
# CONFIG LOCAL (MySQL sur ta machine - WAMP/XAMPP)
# Décommenter ce bloc pour travailler en local
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio?useSSL=false&serverTimezone=Europe/Paris&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ============================================================
# CONFIG PROD (MariaDB sur la VM)
# Décommenter ce bloc pour déployer sur la VM
# ============================================================
#spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_builder?useSSL=false&serverTimezone=Europe/Paris&zeroDateTimeBehavior=convertToNull
#spring.datasource.username=portfolio
#spring.datasource.password=Password123!
#spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.format_sql=true

# logs
logging.level.org.hibernate=info
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# Mustache
spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.html
