{{>partials/header}}

<main class="container">
    <div class="card">
        <h2>Modifier la rubrique</h2>

        <!-- Formulaire de modification d'une rubrique -->
        <!-- L'action pointe vers la route POST /rubrics/{id}/edit -->
        <form method="post" action="/rubrics/{{rubric.id}}/edit" class="mt-8">

            <!-- Champ : nom de la rubrique (pré-rempli avec la valeur actuelle) -->
            <div class="mb-8">
                <label>Nom de la rubrique</label>
                <input type="text" name="name" value="{{rubric.name}}" required />
            </div>

            <!-- Liste déroulante : choix de la catégorie -->
            <!-- La catégorie actuellement sélectionnée n'est pas pré-sélectionnée visuellement
                 (Mustache ne gère pas nativement le "selected", le formulaire reste simple) -->
            <div class="mb-8">
                <label>Catégorie</label>
                <select name="categoryId" required>
                    {{#categories}}
                    <option value="{{id}}">{{name}}</option>
                    {{/categories}}
                </select>
            </div>

            <!-- Boutons d'action -->
            <div class="actions">
                <button class="button" type="submit">Enregistrer</button>
                <!-- profileId est passé par le contrôleur pour le lien de retour -->
                <a class="button secondary" href="/profiles/{{profileId}}">Annuler</a>
            </div>
        </form>
    </div>
</main>

{{>partials/footer}}
